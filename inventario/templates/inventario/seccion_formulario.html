{% extends 'inventario/base.html' %}

{% block content %}
<h1 class="main-title">Registrar/Editar Sección</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <a href="{% url 'lista_secciones' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
